name: Windows alpha
on: [push, pull_request]
jobs:
  validate:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: dotnet build -c Release -m:1 --disable-build-servers
      - run: dotnet test -c Release -m:1 --disable-build-servers --no-build
      - run: ./build/Publish-Alpha.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: GLauncher-0.1.0-alpha.1-win-x64
          path: artifacts/GLauncher-0.1.0-alpha.1-win-x64/
          retention-days: 7
      # Interactive GUI checks run locally, not in a headless hosted runner.
